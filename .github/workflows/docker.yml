name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. BuildKit + smoke test against the multi-arch image. Runs on every PR
  #    so a broken Dockerfile is caught before review.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build (and load on amd64 so we can smoke-test)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # BuildKit cache for CI: cache-to-the-bucket
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ matrix.platform == 'linux/amd64' }}

      - name: Smoke test (linux/amd64 only)
        if: matrix.platform == 'linux/amd64' && steps.build.outputs.digest
        run: |
          # The build above loaded the image as ${{ env.IMAGE_NAME }}:branch
          # so the smoke script can pick it up via $IMAGE.
          IMAGE="${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            scripts/docker-smoke-test.sh

  # ---------------------------------------------------------------------------
  # 2. Catalog-schema sanity check. Static-only — runs without a Docker daemon.
  # ---------------------------------------------------------------------------
  catalog:
    name: docker-mcp catalog schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate server.yaml + tools.json
        run: uv run pytest tests/test_d6_docker.py -v